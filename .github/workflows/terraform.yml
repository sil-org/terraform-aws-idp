name: Terraform

on:
  push:
    branches: [ '**' ]

jobs:
  test:
    uses: sil-org/workflows/.github/workflows/terraform.yml@main
    with:
      terraform-version: '~> 1.8'
      test-dir: test

  tftest:
    name: 'Terraform Test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.8"

      - name: Test
        run: ./test.sh
